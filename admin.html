<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AFIA Orders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f9fa,#0b1a20);--card:light-dark(#fff,#12262d);--ink:light-dark(#10232b,#e8f1f3);--soft:light-dark(#4a5f68,#a9bcc3);--line:light-dark(#d9e4e7,#23363d);--ind:#26398f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{background:#0a3846;color:#fff;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:12px max(4vw,16px)}
.logo{font:600 26px/1 'Cormorant Garamond',serif;letter-spacing:.2em}.logo small{font:500 10px Inter;letter-spacing:.4em;margin-left:10px}
main{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px Inter;cursor:pointer}
.btn.pri{background:var(--ind);border-color:var(--ind);color:#fff}
input,select,textarea{min-height:44px;font:16px Inter;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;font-weight:500;margin:10px 0 4px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.stats b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.tabs button[aria-selected=true]{background:var(--ind);color:#fff;border-color:var(--ind)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover{background:light-dark(#eef5f6,#16303a)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:light-dark(#e6edf0,#20363e)}
.s-new{background:#fde9c8;color:#6b4200}.s-delivered{background:#d9f1e1;color:#14532d}.s-cancelled{background:#f6d8d8;color:#7a1d1d}
.detail td{background:light-dark(#f2f7f8,#0f2229)}
.err{color:#b42318}.muted{color:var(--soft);font-size:13px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="logo">AFIA<small>ORDERS</small></div><div id="who" class="muted" style="color:#cfe4ea"></div></header>
<main>
<section id="login" class="card" style="max-width:420px;margin:40px auto" hidden>
<h1 style="font:600 32px 'Cormorant Garamond',serif;margin:0 0 8px">Staff sign in</h1>
<form id="loginForm"><label for="em">Email</label><input id="em" type="email" required autocomplete="username" style="width:100%"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password" style="width:100%">
<p><button class="btn pri" type="submit" style="width:100%">Sign in</button></p><p id="loginMsg" class="err" role="alert"></p></form>
</section>
<section id="setup" class="card" hidden><h2>Not connected yet</h2><p>Add the Supabase URL and publishable key to <code>config.js</code>.</p></section>
<section id="app" hidden>
<div class="stats" id="stats"></div>
<div class="bar tabs" role="tablist"><button class="btn" role="tab" aria-selected="true" data-tab="orders" type="button">Orders</button><button class="btn" role="tab" aria-selected="false" data-tab="enquiries" type="button">Enquiries</button><span style="flex:1"></span><button class="btn" id="refresh" type="button">Refresh</button></div>
<div class="bar"><label for="filter" style="margin:0">Status</label><select id="filter"></select><input id="search" placeholder="Search code, name or phone" style="flex:1;min-width:200px" aria-label="Search"></div>
<div class="scroll"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<p id="msg" class="muted" aria-live="polite"></p>
</section>
</main>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
{
const C=window.AFIA_CONFIG||{};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira=n=>'₦'+Math.round(n||0).toLocaleString('en-NG');
const when=d=>new Date(d).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const OS=['new','confirmed','paid','out_for_delivery','delivered','cancelled'];
const ES=['new','contacted','quoted','won','lost'];
const label=s=>s.replace(/_/g,' ');
const waLink=p=>'https://wa.me/'+String(p).replace(/\D/g,'').replace(/^0/,'234');
if(!C.supabaseUrl||!C.supabaseKey||!window.supabase){$('setup').hidden=false}else{
const db=window.supabase.createClient(C.supabaseUrl,C.supabaseKey);
let tab='orders',rows=[],open=null;
function setFilter(){const list=tab==='orders'?OS:ES;$('filter').innerHTML='<option value="">All</option>'+list.map(s=>`<option value="${s}">${label(s)}</option>`).join('')}
async function start(){const {data:{session}}=await db.auth.getSession();if(!session){$('login').hidden=false;$('app').hidden=true;$('who').textContent='';return}
  $('login').hidden=true;$('app').hidden=false;$('who').innerHTML=esc(session.user.email)+' · <button class="btn" id="out" type="button" style="min-height:32px">Sign out</button>';
  $('out').onclick=async()=>{await db.auth.signOut();start()};setFilter();load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginMsg').textContent='';const {error}=await db.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('loginMsg').textContent=error.message;else start()};
async function load(){$('msg').textContent='Loading…';
  const q=tab==='orders'?db.from('orders').select('*, order_items(*), delivery_zones(name)').order('created_at',{ascending:false}).limit(500):db.from('enquiries').select('*').order('created_at',{ascending:false}).limit(500);
  const {data,error}=await q;if(error){$('msg').textContent='Could not load: '+error.message;return}
  rows=data||[];if(!rows.length&&tab==='orders'){const {data:a}=await db.rpc('is_admin');if(a===false){$('msg').textContent='This account is not on the staff list. Ask the owner to add your email to the admins table.';draw();return}}
  $('msg').textContent='';stats();draw()}
function stats(){if(tab!=='orders'){$('stats').innerHTML='';return}
  const today=new Date().toDateString(),m=new Date();
  const t=rows.filter(r=>new Date(r.created_at).toDateString()===today);
  const month=rows.filter(r=>{const d=new Date(r.created_at);return d.getMonth()===m.getMonth()&&d.getFullYear()===m.getFullYear()&&r.status!=='cancelled'});
  const s=[['New, to confirm',rows.filter(r=>r.status==='new').length],['Orders today',t.length],['To deliver',rows.filter(r=>['confirmed','paid','out_for_delivery'].includes(r.status)).length],['Sales this month',naira(month.reduce((a,r)=>a+r.total,0))]];
  $('stats').innerHTML=s.map(x=>`<div class="card"><span class="muted">${x[0]}</span><b>${x[1]}</b></div>`).join('')}
function draw(){const f=$('filter').value,q=$('search').value.trim().toLowerCase();
  const list=rows.filter(r=>(!f||r.status===f)&&(!q||[r.code,r.customer_name,r.name,r.phone].some(v=>String(v||'').toLowerCase().includes(q))));
  if(tab==='orders'){$('thead').innerHTML='<tr><th>Order</th><th>Placed</th><th>Customer</th><th>Area</th><th class="n">Total</th><th>Status</th></tr>';
    $('tbody').innerHTML=list.map(r=>`<tr class="row" data-id="${esc(r.id)}"><td><b>${esc(r.code)}</b></td><td>${when(r.created_at)}</td><td>${esc(r.customer_name)}<div class="muted">${esc(r.phone)}</div></td><td>${esc(r.delivery_zones?.name)}</td><td class="n">${naira(r.total)}</td><td><span class="pill s-${esc(r.status)}">${label(esc(r.status))}</span></td></tr>`+(open===r.id?detailOrder(r):'')).join('')||'<tr><td colspan="6" class="muted">No orders yet.</td></tr>'}
  else{$('thead').innerHTML='<tr><th>Received</th><th>Type</th><th>Contact</th><th>Details</th><th>Status</th></tr>';
    $('tbody').innerHTML=list.map(r=>`<tr class="row" data-id="${esc(r.id)}"><td>${when(r.created_at)}</td><td>${esc(r.kind)}</td><td>${esc(r.name)}<div class="muted">${esc(r.phone)}</div></td><td>${Object.entries(r.details||{}).map(([k,v])=>`<div><span class="muted">${esc(k)}:</span> ${esc(v)}</div>`).join('')}</td><td><span class="pill">${esc(r.status)}</span></td></tr>`+(open===r.id?detailEnq(r):'')).join('')||'<tr><td colspan="5" class="muted">No enquiries yet.</td></tr>'}
  document.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{open=open===tr.dataset.id?null:tr.dataset.id;draw()});bindDetail()}
function detailOrder(r){return `<tr class="detail"><td colspan="6"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">
<div><b>Items</b>${(r.order_items||[]).map(i=>`<div>${i.quantity} × ${esc(i.product_name)} · ${esc(i.pack_label)} <span class="muted">(${naira(i.line_total)})</span></div>`).join('')}<div class="muted" style="margin-top:6px">Subtotal ${naira(r.subtotal)} · Delivery ${naira(r.delivery_fee)} · Total ${naira(r.total)}</div></div>
<div><b>Deliver to</b><div>${esc(r.address)}</div><div class="muted">Date: ${esc(r.delivery_date||'next available')}</div><p><a href="${waLink(r.phone)}">WhatsApp customer</a> · ${esc(r.phone)}</p></div>
<div><label for="st-${esc(r.id)}">Status</label><select id="st-${esc(r.id)}">${OS.map(s=>`<option value="${s}" ${s===r.status?'selected':''}>${label(s)}</option>`).join('')}</select>
<label for="nt-${esc(r.id)}">Staff notes</label><textarea id="nt-${esc(r.id)}" rows="2" style="width:100%">${esc(r.admin_notes)}</textarea><p><button class="btn pri save" data-t="orders" data-id="${esc(r.id)}" type="button">Save</button></p></div></div></td></tr>`}
function detailEnq(r){return `<tr class="detail"><td colspan="5"><label for="st-${esc(r.id)}">Status</label><select id="st-${esc(r.id)}">${ES.map(s=>`<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select>
<label for="nt-${esc(r.id)}">Staff notes</label><textarea id="nt-${esc(r.id)}" rows="2" style="width:100%;max-width:600px">${esc(r.admin_notes)}</textarea><p><a href="${waLink(r.phone)}">WhatsApp contact</a> · <button class="btn pri save" data-t="enquiries" data-id="${esc(r.id)}" type="button">Save</button></p></td></tr>`}
function bindDetail(){document.querySelectorAll('.detail').forEach(d=>d.onclick=e=>e.stopPropagation());
  document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;b.textContent='Saving…';
    const {error}=await db.from(b.dataset.t).update({status:$('st-'+id).value,admin_notes:$('nt-'+id).value}).eq('id',id);
    if(error){b.textContent='Save';$('msg').textContent='Could not save: '+error.message}else{const r=rows.find(x=>x.id===id);r.status=$('st-'+id).value;r.admin_notes=$('nt-'+id).value;stats();draw();$('msg').textContent='Saved.'}})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x===b));open=null;setFilter();load()});
$('filter').onchange=draw;$('search').oninput=draw;$('refresh').onclick=load;
db.channel('orders-live').on('postgres_changes',{event:'INSERT',schema:'public',table:'orders'},()=>{if(tab==='orders')load()}).subscribe();
start();
}
}
</script>
</body>
</html>
